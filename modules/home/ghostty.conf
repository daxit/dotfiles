# Ghostty terminal config. Symlinked to ~/.config/ghostty/config by
# modules/home/shell.nix. See all options: `ghostty +show-config --default`

# Built-in theme; pairs with the gruvbox_dark starship palette.
theme = Gruvbox Dark

# Installed via modules/darwin/fonts.nix (nerd-fonts.jetbrains-mono).
font-family = JetBrainsMono Nerd Font
font-size = 14

window-padding-x = 8
window-padding-y = 8
